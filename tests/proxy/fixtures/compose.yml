services:
  nginx:
    image: nginx:1.31.6-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    environment:
      - VIRTUAL_HOST=${COMPOSE_PROJECT_NAME}.localhost
      - VIRTUAL_PORT=80
      - SELF_SIGNED_HOST=${COMPOSE_PROJECT_NAME}.localhost
    depends_on:
      proxy-coordinator:
        condition: service_healthy

  proxy-coordinator:
    image: docker:29.9.1-cli@sha256:6fae2214c3121a28d5aa639d09032f61310b7c9c75ffbad1025f261a1b621800
    entrypoint: ["/bin/sh", "/project/.docker/scripts/proxy-coordinator.sh"]
    labels:
      coop.librecode.dev-proxy-client: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPO_ROOT}:/project:ro
    working_dir: /project
    environment:
      - PROJECT_DIR=/project
      - PROJECT_COMPOSE_FILE=/project/tests/proxy/fixtures/compose.yml
      - REPO_ROOT=/project
      - PROXY_LEASE_GRACE_SECONDS=0
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - VERSION_NEXTCLOUD=master
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/librecode-proxy-ready"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 1s
    restart: "no"
