services:
  nginx:
    image: nginx:1.31.8-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    environment:
      - VIRTUAL_HOST=${COMPOSE_PROJECT_NAME}.localhost
      - VIRTUAL_PORT=80
      - SELF_SIGNED_HOST=${COMPOSE_PROJECT_NAME}.localhost
    depends_on:
      proxy-coordinator:
        condition: service_healthy

  proxy-coordinator:
    image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
    entrypoint: ["/bin/sh", "/project/.docker/scripts/proxy-coordinator.sh"]
    labels:
      coop.librecode.dev-proxy-client: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPO_ROOT}:/project:ro
    working_dir: /project
    environment:
      - PROJECT_DIR=/project
      - PROJECT_COMPOSE_FILE=/project/tests/proxy/fixtures/compose.yml
      - REPO_ROOT=/project
      - PROXY_LEASE_GRACE_SECONDS=0
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - VERSION_NEXTCLOUD=master
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/librecode-proxy-ready"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 1s
    restart: "no"
