services:
  nginx:
    image: nginx:1.31.5-alpine@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_default"
      - "traefik.http.routers.librecode-${COMPOSE_PROJECT_NAME}--nextcloud.rule=Host(`${COMPOSE_PROJECT_NAME}.localhost`)"
      - "traefik.http.services.librecode-${COMPOSE_PROJECT_NAME}--nextcloud.loadbalancer.server.port=80"

  proxy-coordinator:
    image: docker:29.8.0-cli@sha256:eccaacfeed644c7de222ff047483568cb988dde95476fbaaf10ea2d04921bb66
    entrypoint: ["/bin/sh", "/project/.docker/scripts/proxy-coordinator.sh"]
    labels:
      coop.librecode.dev-proxy-client: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPO_ROOT}:/project:ro
    working_dir: /project
    environment:
      - PROJECT_DIR=/project
      - PROJECT_COMPOSE_FILE=/project/tests/proxy/fixtures/compose.yml
      - REPO_ROOT=/project
      - PROXY_LEASE_GRACE_SECONDS=0
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - VERSION_NEXTCLOUD=master
    restart: "no"
    depends_on:
      - nginx
