services:
  nginx:
    image: nginx:1.31.5-alpine@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    environment:
      - VIRTUAL_HOST=${COMPOSE_PROJECT_NAME}.localhost
      - VIRTUAL_PORT=80
      - SELF_SIGNED_HOST=${COMPOSE_PROJECT_NAME}.localhost

  proxy-coordinator:
    image: docker:29.8.1-cli@sha256:018edbc908e08fcc9dbf029c812c34251e9b4719e6f71ca0e5eae2a987d014ca
    entrypoint: ["/bin/sh", "/project/.docker/scripts/proxy-coordinator.sh"]
    labels:
      coop.librecode.dev-proxy-client: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPO_ROOT}:/project:ro
    working_dir: /project
    environment:
      - PROJECT_DIR=/project
      - PROJECT_COMPOSE_FILE=/project/tests/proxy/fixtures/compose.yml
      - REPO_ROOT=/project
      - PROXY_LEASE_GRACE_SECONDS=0
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - VERSION_NEXTCLOUD=master
    restart: "no"
    depends_on:
      - nginx
