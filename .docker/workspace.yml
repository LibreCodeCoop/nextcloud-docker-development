services:
  nextcloud:
    volumes:
      - type: bind
        source: ${NCDD_WORKSPACE:?NCDD_WORKSPACE is required}
        target: /var/www/html/apps-extra
  nginx:
    volumes:
      - type: bind
        source: ${NCDD_WORKSPACE:?NCDD_WORKSPACE is required}
        target: /var/www/html/apps-extra
        read_only: true
  playwright:
    volumes:
      - type: bind
        source: ${NCDD_WORKSPACE:?NCDD_WORKSPACE is required}
        target: /var/www/html/apps-extra
