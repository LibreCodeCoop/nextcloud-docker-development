server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /__librecode_not_found__ {
        return 404;
    }

    error_page 404 /index.html;

    location = /index.html {
    }

    location = /runtime.json {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
