server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;

    location / {
        try_files /index.html =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name *.localhost;

    root /usr/share/nginx/html;

    location = /index.html {
        internal;
    }

    location / {
        error_page 404 =404 /index.html;
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    root /usr/share/nginx/html;

    location / {
        try_files /index.html =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.localhost;

    ssl_certificate /etc/nginx/certs/*.localhost.crt;
    ssl_certificate_key /etc/nginx/certs/*.localhost.key;

    root /usr/share/nginx/html;

    location = /index.html {
        internal;
    }

    location / {
        error_page 404 =404 /index.html;
        return 404;
    }
}
