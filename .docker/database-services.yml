services:
  mysql:
    # Pin to 8.4: mysql:latest currently resolves to 9.x, and Nextcloud autoinstall
    # runs with the application user, which cannot read mysql.component there.
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    volumes:
      - ${WORKER_VOLUMES_DIR:-../volumes}/mysql/init:/docker-entrypoint-initdb.d
      - ${WORKER_VOLUMES_DIR:-../volumes}/mysql/data:/var/lib/mysql
    ports:
      - target: 3306
        published: "3306-3325"
        host_ip: ${MYSQL_IP_BIND:-127.0.0.1}
    command: ["mysqld"]
    environment:
      - TZ=${TZ:-CET}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-nextcloud}
  mariadb106:
    image: mariadb:10.6.28@sha256:23616f0bd3aff922f4dea4130f1d0a09f3571d20b7b36c8f49840672dc309e8c
    volumes:
      - ${WORKER_VOLUMES_DIR:-../volumes}/mariadb/data:/var/lib/mysql
    ports:
      - target: 3306
        published: "3306-3325"
        host_ip: ${MARIADB_IP_BIND:-127.0.0.1}
    command:
      - /bin/sh
      - -c
      - |
        set -- mariadbd
        if [ -n "$DB_SQL_MODE" ]; then
          set -- "$@" "--sql-mode=$DB_SQL_MODE"
        fi
        exec "$@"
    environment:
      - TZ=${TZ:-CET}
      - MARIADB_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MARIADB_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MARIADB_USER=${MYSQL_USER:-nextcloud}
      - MARIADB_PASSWORD=${MYSQL_PASSWORD:-nextcloud}
      - DB_SQL_MODE=${DB_SQL_MODE:-}
  mariadb1011:
    image: mariadb:10.11.19@sha256:07c0aaff7396b74cb7975cba78257178d188e30f531a5db2b617c48beef13c41
    volumes:
      - ${WORKER_VOLUMES_DIR:-../volumes}/mariadb/data:/var/lib/mysql
    ports:
      - target: 3306
        published: "3306-3325"
        host_ip: ${MARIADB_IP_BIND:-127.0.0.1}
    command:
      - /bin/sh
      - -c
      - |
        set -- mariadbd
        if [ -n "$DB_SQL_MODE" ]; then
          set -- "$@" "--sql-mode=$DB_SQL_MODE"
        fi
        exec "$@"
    environment:
      - TZ=${TZ:-CET}
      - MARIADB_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MARIADB_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MARIADB_USER=${MYSQL_USER:-nextcloud}
      - MARIADB_PASSWORD=${MYSQL_PASSWORD:-nextcloud}
      - DB_SQL_MODE=${DB_SQL_MODE:-}
  pgsql:
    image: postgres:13-alpine@sha256:fb9065b6e3e213bdc07edd372a5b2a26245840b7fb65d1fd8b6700106d51805c
    volumes:
      - ${WORKER_VOLUMES_DIR:-../volumes}/postgres/data:/var/lib/postgresql/data
    ports:
      - target: 5432
        published: "5432-5451"
        host_ip: ${POSTGRES_IP_BIND:-127.0.0.1}
    command: ["postgres", "-c", "log_statement=all"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER:-nextcloud}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nextcloud}