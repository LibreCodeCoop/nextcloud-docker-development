services:
  database:
    extends:
      file: .docker/database-services.yml
      service: ${DB_HOST:-mysql}
    networks:
      default:
        aliases:
          - ${DB_HOST:-mysql}
  nextcloud:
    image: ghcr.io/librecodecoop/nextcloud-dev-php${PHP_VERSION:-83}:latest
    # build:
    #   context: .docker/
    #   dockerfile: Dockerfile.php${PHP_VERSION:-83}
    volumes:
      - ./.docker/scripts/wait-for-db.php:/var/www/scripts/wait-for-db.php
      - ./volumes/php:/var/www/php-config
      - ~/.composer:/var/www/.composer/
      - ~/.npm:/var/www/.npm/
      - ./volumes/nextcloud:/var/www/html
    restart: unless-stopped
    depends_on:
      - database
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - DEFAULT_PHONE_REGION=${DEFAULT_PHONE_REGION:-UTC}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      - NEXTCLOUD_ADMIN_EMAIL=${NEXTCLOUD_ADMIN_EMAIL:-a@test.tld}
      - DB_HOST=${DB_HOST:-mysql}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-nextcloud}
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER:-nextcloud}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nextcloud}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-nextcloud}
      - MAIL_DOMAIN=${MAIL_DOMAIN:-nextcloud.test}
      - MAIL_SMTPPORT=${MAIL_SMTPPORT:-1025}
      - MAIL_SMTPHOST=${MAIL_SMTPHOST:-mailpit}
      - VERSION_NEXTCLOUD=${VERSION_NEXTCLOUD:-master}
      - NEXTCLOUD_HOST=${COMPOSE_PROJECT_NAME}.localhost
      - AUTOINSTALL=${AUTOINSTALL:-1}
      - XDEBUG_CONFIG
      - XDEBUG_MODE
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d:/var/www/php-config
    extra_hosts:
      - host.docker.internal:host-gateway
  nginx:
    image: ghcr.io/librecodecoop/nextcloud-dev-nginx:latest
    # build:
    #   context: .docker/
    #   dockerfile: Dockerfile.nginx
    restart: unless-stopped
    depends_on:
      - nextcloud
    volumes:
      - ./volumes/nextcloud:/var/www/html:ro
      - ./volumes/nginx/includes:/etc/nginx/conf.d/includes/
      - ./volumes/nginx/certs:/certs
    environment:
      - VIRTUAL_HOST=${COMPOSE_PROJECT_NAME}.localhost
      - VIRTUAL_PORT=80
      - SELF_SIGNED_HOST=${COMPOSE_PROJECT_NAME}.localhost
  proxy-coordinator:
    image: docker:29.8.0-cli@sha256:eccaacfeed644c7de222ff047483568cb988dde95476fbaaf10ea2d04921bb66
    entrypoint: ["/bin/sh", "/usr/local/lib/librecode/proxy-coordinator.sh"]
    labels:
      coop.librecode.dev-proxy-client: "true"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ./.docker/scripts:/usr/local/lib/librecode:ro
      - .:${PWD}:ro
    working_dir: ${PWD}
    environment:
      - PROJECT_DIR=${PWD}
      - DOCKER_SOCKET=${DOCKER_SOCKET:-/var/run/docker.sock}
      - IP_BIND=${IP_BIND:-127.0.0.1}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      - VERSION_NEXTCLOUD=${VERSION_NEXTCLOUD:-master}
    restart: "no"
    depends_on:
      - nextcloud
  mailpit:
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    environment:
      - VIRTUAL_HOST=${COMPOSE_PROJECT_NAME}-mailpit.localhost
      - VIRTUAL_PORT=8025
      - SELF_SIGNED_HOST=${COMPOSE_PROJECT_NAME}-mailpit.localhost
  redis:
    image: redis:8.8.2@sha256:37227fff5638322f4ebea25d6d0dc3ee50848604e82b81426f11507b3ec7d2cc
  eurooffice:
    image: ghcr.io/euro-office/documentserver:latest
    profiles:
      - eurooffice
    restart: always
    volumes:
      - ./volumes/eurooffice:/home/eurooffice/.eurooffice
      - ./volumes/eurooffice/local.json:/etc/onlyoffice/documentserver/local.json
      - ./volumes/nextcloud/apps-extra/eurooffice-plugin:/var/www/onlyoffice/documentserver/sdkjs-plugins/libresign:ro
    environment:
      - EXAMPLE_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:-my_jwt_secret}
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - VIRTUAL_HOST=${COMPOSE_PROJECT_NAME}-eurooffice.localhost
      - VIRTUAL_PORT=80
      - SELF_SIGNED_HOST=${COMPOSE_PROJECT_NAME}-eurooffice.localhost
    extra_hosts:
      - host.docker.internal:host-gateway
