name: Proxy tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Proxy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bats-core
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Run unit tests
        run: bats tests/proxy/lease.bats tests/proxy/infrastructure.bats tests/proxy/services.bats tests/proxy/diagnostics.bats tests/proxy/compose-policy.bats tests/worker/contract.bats

  integration:
    name: Proxy Docker integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bats-core
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          REPO_ROOT="$GITHUB_WORKSPACE" COMPOSE_PROJECT_NAME=proxytesta docker compose --file tests/proxy/fixtures/compose.yml config --quiet
      - name: Run Docker integration tests
        run: bats tests/proxy/integration.bats

  sqlite-worker:
    name: SQLite worker integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build PHP 8.3 development image
        run: docker build -f .docker/Dockerfile.php83 -t ghcr.io/librecodecoop/nextcloud-dev-php83:latest .docker
      - name: Start isolated SQLite workers
        run: |
          DB_TYPE=sqlite sh ./dev-worker sqlite-a up
          DB_TYPE=sqlite sh ./dev-worker sqlite-b up
      - name: Verify SQLite runtime
        run: |
          DB_TYPE=sqlite sh ./dev-worker sqlite-a exec php -r 'exit(extension_loaded("pdo_sqlite") ? 0 : 1);'
          DB_TYPE=sqlite sh ./dev-worker sqlite-a exec occ status | grep -q 'installed: true'
          DB_TYPE=sqlite sh ./dev-worker sqlite-b exec occ status | grep -q 'installed: true'
      - name: Verify SQLite worker state isolation
        run: |
          DB_TYPE=sqlite sh ./dev-worker sqlite-a exec sh -c 'printf alpha > /var/www/html/data/worker-probe'
          DB_TYPE=sqlite sh ./dev-worker sqlite-b exec sh -c 'printf beta > /var/www/html/data/worker-probe'
          alpha="$(DB_TYPE=sqlite sh ./dev-worker sqlite-a exec cat /var/www/html/data/worker-probe)"
          beta="$(DB_TYPE=sqlite sh ./dev-worker sqlite-b exec cat /var/www/html/data/worker-probe)"
          printf 'sqlite-a worker_probe=%s\nsqlite-b worker_probe=%s\n' "$alpha" "$beta"
          test "$alpha" = alpha
          test "$beta" = beta
      - name: Verify SQLite starts no database service
        run: |
          database_containers="$(docker ps --format '{{.Names}}' | grep -E '^ncdev-sqlite-(a|b)-database-1$' || true)"
          if [ -n "$database_containers" ]; then
            printf 'Unexpected database containers:\n%s\n' "$database_containers" >&2
            exit 1
          fi
      - name: Collect worker logs
        if: failure()
        run: |
          DB_TYPE=sqlite sh ./dev-worker sqlite-a logs || true
          DB_TYPE=sqlite sh ./dev-worker sqlite-b logs || true
      - name: Destroy workers
        if: always()
        run: |
          DB_TYPE=sqlite sh ./dev-worker sqlite-a destroy || true
          DB_TYPE=sqlite sh ./dev-worker sqlite-b destroy || true

  mariadb-worker:
    name: MariaDB ${{ matrix.mariadb }} worker integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mariadb: ['10.6', '10.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build PHP 8.3 development image
        run: docker build -f .docker/Dockerfile.php83 -t ghcr.io/librecodecoop/nextcloud-dev-php83:latest .docker
      - name: Start MariaDB worker
        env:
          MARIADB_VERSION: ${{ matrix.mariadb }}
          DB_SQL_MODE: ONLY_FULL_GROUP_BY
        run: |
          worker="maria-${MARIADB_VERSION//./-}"
          DB_TYPE=mariadb sh ./dev-worker "$worker" up
      - name: Verify MariaDB version and SQL mode
        env:
          MARIADB_VERSION: ${{ matrix.mariadb }}
          DB_SQL_MODE: ONLY_FULL_GROUP_BY
        run: |
          worker="maria-${MARIADB_VERSION//./-}"
          version="$(DB_TYPE=mariadb sh ./dev-worker "$worker" db-exec mariadb -uroot -proot -Nse 'SELECT VERSION()')"
          case "$version" in
            "$MARIADB_VERSION".*) ;;
            *) echo "Unexpected MariaDB version: $version" >&2; exit 1 ;;
          esac
          DB_TYPE=mariadb sh ./dev-worker "$worker" db-exec mariadb -uroot -proot -Nse 'SELECT @@GLOBAL.sql_mode' | grep -q 'ONLY_FULL_GROUP_BY'
          DB_TYPE=mariadb sh ./dev-worker "$worker" status | grep -q 'installed: true'
      - name: Verify two-worker isolation
        if: matrix.mariadb == '10.11'
        env:
          MARIADB_VERSION: ${{ matrix.mariadb }}
          DB_SQL_MODE: ONLY_FULL_GROUP_BY
        run: |
          DB_TYPE=mariadb sh ./dev-worker maria-peer up
          DB_TYPE=mariadb sh ./dev-worker maria-10-11 exec sh -c 'printf alpha > /var/www/html/data/worker-probe'
          DB_TYPE=mariadb sh ./dev-worker maria-peer exec sh -c 'printf beta > /var/www/html/data/worker-probe'
          alpha="$(DB_TYPE=mariadb sh ./dev-worker maria-10-11 exec cat /var/www/html/data/worker-probe)"
          beta="$(DB_TYPE=mariadb sh ./dev-worker maria-peer exec cat /var/www/html/data/worker-probe)"
          printf 'maria-10-11 worker_probe=%s\nmaria-peer worker_probe=%s\n' "$alpha" "$beta"
          test "$alpha" = alpha
          test "$beta" = beta
      - name: Collect worker logs
        if: failure()
        env:
          MARIADB_VERSION: ${{ matrix.mariadb }}
        run: |
          worker="maria-${MARIADB_VERSION//./-}"
          DB_TYPE=mariadb sh ./dev-worker "$worker" logs || true
          if [ "$MARIADB_VERSION" = 10.11 ]; then
            DB_TYPE=mariadb sh ./dev-worker maria-peer logs || true
          fi
      - name: Destroy workers
        if: always()
        env:
          MARIADB_VERSION: ${{ matrix.mariadb }}
        run: |
          worker="maria-${MARIADB_VERSION//./-}"
          DB_TYPE=mariadb sh ./dev-worker "$worker" destroy || true
          if [ "$MARIADB_VERSION" = 10.11 ]; then
            DB_TYPE=mariadb sh ./dev-worker maria-peer destroy || true
          fi

  downstream-consumer:
    name: Downstream consumer integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build PHP 8.3 development image
        run: docker build -f .docker/Dockerfile.php83 -t ghcr.io/librecodecoop/nextcloud-dev-php83:latest .docker
      - name: Prepare independent downstream checkouts
        run: |
          cp -a tests/worker/fixtures/sample-app /tmp/consumer-a
          cp -a tests/worker/fixtures/sample-app /tmp/consumer-b
          printf 'alpha\n' > /tmp/consumer-a/marker.txt
          printf 'beta\n' > /tmp/consumer-b/marker.txt
      - name: Start downstream workers and run setup hooks
        run: |
          APP_ID=sample_app APP_SOURCE_DIR=/tmp/consumer-a APP_SETUP_COMMAND='printf setup-a > /var/www/html/data/downstream-setup' DB_TYPE=sqlite sh ./dev-worker consumer-a up
          APP_ID=sample_app APP_SOURCE_DIR=/tmp/consumer-b APP_SETUP_COMMAND='printf setup-b > /var/www/html/data/downstream-setup' DB_TYPE=sqlite sh ./dev-worker consumer-b up
      - name: Verify checkout, hook, URLs, and isolation
        run: |
          test "$(DB_TYPE=sqlite sh ./dev-worker consumer-a exec cat /var/www/html/apps-extra/sample_app/marker.txt)" = alpha
          test "$(DB_TYPE=sqlite sh ./dev-worker consumer-b exec cat /var/www/html/apps-extra/sample_app/marker.txt)" = beta
          test "$(DB_TYPE=sqlite sh ./dev-worker consumer-a exec cat /var/www/html/data/downstream-setup)" = setup-a
          test "$(DB_TYPE=sqlite sh ./dev-worker consumer-b exec cat /var/www/html/data/downstream-setup)" = setup-b
          DB_TYPE=sqlite sh ./dev-worker consumer-a urls | grep -q 'https://ncdev-consumer-a.localhost'
          DB_TYPE=sqlite sh ./dev-worker consumer-b urls | grep -q 'https://ncdev-consumer-b-mailpit.localhost'
      - name: Verify teardown affects only the selected worker
        run: |
          DB_TYPE=sqlite sh ./dev-worker consumer-a destroy
          DB_TYPE=sqlite sh ./dev-worker consumer-b status | grep -q 'installed: true'
          test "$(DB_TYPE=sqlite sh ./dev-worker consumer-b exec cat /var/www/html/apps-extra/sample_app/marker.txt)" = beta
      - name: Collect worker logs
        if: failure()
        run: |
          DB_TYPE=sqlite sh ./dev-worker consumer-a logs || true
          DB_TYPE=sqlite sh ./dev-worker consumer-b logs || true
      - name: Destroy remaining worker
        if: always()
        run: DB_TYPE=sqlite sh ./dev-worker consumer-b destroy || true
