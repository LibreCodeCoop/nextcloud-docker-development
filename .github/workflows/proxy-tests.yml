name: Proxy tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Proxy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bats-core
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Run unit tests
        run: bats tests/proxy/lease.bats tests/proxy/infrastructure.bats tests/proxy/services.bats tests/proxy/diagnostics.bats tests/proxy/compose-policy.bats tests/worker/contract.bats

  integration:
    name: Proxy Docker integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bats-core
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          REPO_ROOT="$GITHUB_WORKSPACE" COMPOSE_PROJECT_NAME=proxytesta docker compose --file tests/proxy/fixtures/compose.yml config --quiet
      - name: Run Docker integration tests
        run: bats tests/proxy/integration.bats


  mariadb-worker:
    name: MariaDB ${{ matrix.mariadb }} worker integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mariadb: ['10.6', '10.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start MariaDB worker
        env:
          MARIADB_VERSION: ${{ matrix.mariadb }}
          DB_SQL_MODE: ONLY_FULL_GROUP_BY
        run: |
          worker="maria-${MARIADB_VERSION//./-}"
          DB_TYPE=mariadb sh ./dev-worker "$worker" up
      - name: Verify MariaDB version and SQL mode
        env:
          MARIADB_VERSION: ${{ matrix.mariadb }}
          DB_SQL_MODE: ONLY_FULL_GROUP_BY
        run: |
          worker="maria-${MARIADB_VERSION//./-}"
          version="$(DB_TYPE=mariadb sh ./dev-worker "$worker" db-exec mariadb -uroot -proot -Nse 'SELECT VERSION()')"
          case "$version" in
            "$MARIADB_VERSION".*) ;;
            *) echo "Unexpected MariaDB version: $version" >&2; exit 1 ;;
          esac
          DB_TYPE=mariadb sh ./dev-worker "$worker" db-exec mariadb -uroot -proot -Nse 'SELECT @@GLOBAL.sql_mode' | grep -q 'ONLY_FULL_GROUP_BY'
          DB_TYPE=mariadb sh ./dev-worker "$worker" status | grep -q 'installed: true'
      - name: Verify two-worker isolation
        if: matrix.mariadb == '10.11'
        env:
          MARIADB_VERSION: ${{ matrix.mariadb }}
          DB_SQL_MODE: ONLY_FULL_GROUP_BY
        run: |
          DB_TYPE=mariadb sh ./dev-worker maria-peer up
          DB_TYPE=mariadb sh ./dev-worker maria-10-11 exec occ config:system:set worker_probe --value alpha
          DB_TYPE=mariadb sh ./dev-worker maria-peer exec occ config:system:set worker_probe --value beta
          test "$(DB_TYPE=mariadb sh ./dev-worker maria-10-11 exec occ config:system:get worker_probe)" = alpha
          test "$(DB_TYPE=mariadb sh ./dev-worker maria-peer exec occ config:system:get worker_probe)" = beta
      - name: Collect worker logs
        if: failure()
        env:
          MARIADB_VERSION: ${{ matrix.mariadb }}
        run: |
          worker="maria-${MARIADB_VERSION//./-}"
          DB_TYPE=mariadb sh ./dev-worker "$worker" logs || true
          if [ "$MARIADB_VERSION" = 10.11 ]; then
            DB_TYPE=mariadb sh ./dev-worker maria-peer logs || true
          fi
      - name: Destroy workers
        if: always()
        env:
          MARIADB_VERSION: ${{ matrix.mariadb }}
        run: |
          worker="maria-${MARIADB_VERSION//./-}"
          DB_TYPE=mariadb sh ./dev-worker "$worker" destroy || true
          if [ "$MARIADB_VERSION" = 10.11 ]; then
            DB_TYPE=mariadb sh ./dev-worker maria-peer destroy || true
          fi
