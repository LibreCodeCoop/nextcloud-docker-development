name: Proxy tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Proxy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bats-core
        uses: bats-core/bats-action@4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Run unit tests
        run: bats tests/proxy/lease.bats tests/proxy/infrastructure.bats tests/proxy/services.bats tests/proxy/diagnostics.bats tests/proxy/compose-policy.bats

  image-digests:
    name: Inspect runtime image digests
    runs-on: ubuntu-latest
    steps:
      - name: Resolve multi-platform digests
        run: |
          for image in \
            docker:29.8.0-cli \
            axllent/mailpit:v1.31.1 \
            redis:8.8.2 \
            nginxproxy/nginx-proxy:1.11.6-alpine \
            sebastienheyd/self-signed-proxy-companion:1.1.0 \
            nginx:1.31.5-alpine
          do
            echo "IMAGE $image"
            docker buildx imagetools inspect "$image" | sed -n '1,5p'
          done

  integration:
    name: Proxy Docker integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bats-core
        uses: bats-core/bats-action@4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          REPO_ROOT="$GITHUB_WORKSPACE" COMPOSE_PROJECT_NAME=proxytesta docker compose --file tests/proxy/fixtures/compose.yml config --quiet
      - name: Run Docker integration tests
        run: bats tests/proxy/integration.bats
