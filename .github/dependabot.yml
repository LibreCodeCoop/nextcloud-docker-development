version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/.docker/"
    schedule:
      interval: "daily"
    # Each Dockerfile targets a fixed PHP minor version; update patches only.
    ignore:
      - dependency-name: "php"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/.docker/"
      - "/tests/proxy/fixtures/"
    schedule:
      interval: "daily"
