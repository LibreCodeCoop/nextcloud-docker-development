version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/.docker/"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/.docker/"
      - "/tests/proxy/fixtures/"
    schedule:
      interval: "daily"
